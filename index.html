    <style>
     body {
     background-image: url(bg.jpg);
     display: flex;
     justify-content: center;
     align-items: center;
     margin: 0;
     background-size: cover;
     background-repeat: no-repeat;
     background-position: center 0;
     background-attachment: fixed;
 }
 a{
    position: absolute;
    top: 210px;left:165px;
    text-decoration: none;
    color:#ff0073;
 }
 .loader {
    position: absolute;
    top: 400px;
     width: 25em;
     height: 25em;
     font-size: 25px;
     position: relative;
     display: flex;
     align-items: center;
     justify-content: center;
 }
 .line:nth-child(1) {
     width: 100%;
     height: 100%;
     position: absolute;
     border-radius: 50%;
     border: solid;
     border-width: 0.2em 0.2em 0 0;
     color: rgb(255, 60, 145);
     border-color: currentColor transparent transparent transparent;
 }
 .line:nth-child(2) {
     width: 80%;
     height: 80%;
     position: absolute;
     border-radius: 50%;
     border: solid;
     border-width: 0.2em 0 0 0.2em;
     color: rgb(228, 255, 22);
     border-color: currentColor transparent transparent transparent;
 }
 .line:nth-child(1) {
     --deg: -45deg;
 }
 .line:nth-child(2) {
     --deg: -135deg;
 }
 .loader .line .circle {
     width: 50%;
     height: 1em;
     position: absolute;
     left: 50%;
     top: 50%;
     background-color: transparent;
     transform: rotate(var(--deg));
     transform-origin: left;
 }
 .loader .line .circle::before {
     position: absolute;
     top: -1em;
     right: -1em;
     content: '';
     width: 2em;
     height: 2em;
     background-color: currentColor;
     border-radius: 50%;
     box-shadow:
         0 0 2em, 0 0 4em,
         e e 6em, e 0 8em,
         0 0 10em,
         e e 1em rgba(255，255，255，0.1)
 }
 @keyframes animate {
     to {
         transform: rotate(1turn);
     }
 }
 .loader .line {
     animation: animate 2s linear infinite;
 }
 .loader .line:nth-child(1) {
     animation-direction: normal;
 }
 .loader .line:nth-child(2) {
     animation-direction: reverse;
 }
 h1 {
 
     height:400px;
     width: 400px;
     font-size: 80px;
     border-radius: 40px;
     background-image:conic-gradient(transparent,#00ff73,rgb(246, 255, 0),transparent);
    text-align: center;
    border-radius:  100%;
    }
 .sm {

width:700px;height:260px;
